# ─── Nginx Configuration for indorelatest.com (NeevCloud VPS) ────────────────
#
# File location on VPS: /etc/nginx/sites-available/indorelatest
# Enable: sudo ln -sf /etc/nginx/sites-available/indorelatest /etc/nginx/sites-enabled/
# Test:   sudo nginx -t
# Reload: sudo systemctl reload nginx
#
# ─────────────────────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name indorelatest.com www.indorelatest.com;

    # Redirect HTTP to HTTPS (remove this block if not using SSL)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name indorelatest.com www.indorelatest.com;

    # ── SSL Certificates (update paths for your setup) ──────────────────────
    ssl_certificate     /etc/letsencrypt/live/indorelatest.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/indorelatest.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Increase max upload size for image uploads ───────────────────────────
    client_max_body_size 15M;

    # ── Serve React SPA static files ─────────────────────────────────────────
    root /var/www/indorelatest/dist;
    index index.html;

    # ── Proxy ALL /api/ requests to Express backend (port 5000) ─────────────
    # This includes: /api/news, /api/upload, /api/upload/image/*, /api/contact, etc.
    location /api/ {
        proxy_pass http://localhost:5000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # Increase timeout for image uploads
        proxy_read_timeout 120s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 120s;
    }

    # ── React SPA catch-all (must be LAST) ──────────────────────────────────
    # All non-API, non-static routes serve index.html (for React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
